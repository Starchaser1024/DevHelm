services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devhelm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devhelm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devhelm}
      POSTGRES_DB: ${POSTGRES_DB:-devhelm}
    ports:
      - "5432:5432"
    volumes:
      - devhelm_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devhelm} -d ${POSTGRES_DB:-devhelm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devhelm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - optional

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: devhelm-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - devhelm_etcd_data:/etcd

  minio:
    # MinIO 已于 2025-10 停止在 Docker Hub / quay.io 分发官方镜像，
    # 改用社区维护的 coollabsio 构建（凭据保持 minioadmin/minioadmin，与 Milvus 默认一致）。
    image: coollabsio/minio:latest
    container_name: devhelm-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - devhelm_minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: devhelm-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

volumes:
  devhelm_postgres_data:
  devhelm_etcd_data:
  devhelm_minio_data:
